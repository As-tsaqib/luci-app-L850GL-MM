name: OpenWrt SDK

on:
  push:
    paths:
      - '.github/workflows/openwrt-sdk.yml'
      - 'fibocom-mm-bridge/**'
      - 'luci-app-fibocom/**'
  pull_request:
    paths:
      - '.github/workflows/openwrt-sdk.yml'
      - 'fibocom-mm-bridge/**'
      - 'luci-app-fibocom/**'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release used for labels and official SDK lookup'
        required: true
        default: '25.12.5'
        type: string
      sdk_url:
        description: 'Optional public direct HTTPS SDK URL (ipq40xx/generic only)'
        required: false
        type: string
      sdk_sha256:
        description: 'Required SHA-256 when sdk_url is set'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: openwrt-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OpenWrt ${{ inputs.openwrt_version || '25.12.5' }} ipq40xx/generic
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version || '25.12.5' }}
      SDK_URL_OVERRIDE: ${{ inputs.sdk_url || '' }}
      SDK_SHA256_OVERRIDE: ${{ inputs.sdk_sha256 || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve official SDK and checksum
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OPENWRT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/ipq40xx/generic"
          if [ -n "${SDK_URL_OVERRIDE}" ]; then
            [[ "${SDK_URL_OVERRIDE}" == https://* ]]
            [[ "${SDK_URL_OVERRIDE}" != *'?'* ]]
            [[ "${SDK_URL_OVERRIDE}" != *'#'* ]]
            [[ "${SDK_URL_OVERRIDE}" != https://*@* ]]
            [[ "${SDK_SHA256_OVERRIDE}" =~ ^[[:xdigit:]]{64}$ ]]
            url="${SDK_URL_OVERRIDE}"
            filename="$(basename "${url}")"
            sha256="${SDK_SHA256_OVERRIDE,,}"
          else
            index="$(curl --fail --silent --show-error --location \
              --retry 4 --retry-all-errors "${base_url}/")"
            mapfile -t names < <(printf '%s' "${index}" | \
              grep -oE 'openwrt-sdk-[^"< ]+\.tar\.(zst|xz)' | sort -u)
            [ "${#names[@]}" -eq 1 ]
            filename="${names[0]}"
            url="${base_url}/${filename}"
            sums="$(curl --fail --silent --show-error --location \
              --retry 4 --retry-all-errors "${base_url}/sha256sums")"
            mapfile -t hashes < <(awk -v name="${filename}" \
              '$2 == name || $2 == ("*" name) { print $1 }' <<< "${sums}" | sort -u)
            [ "${#hashes[@]}" -eq 1 ]
            sha256="${hashes[0]}"
            if [ "${OPENWRT_VERSION}" = '25.12.5' ]; then
              [ "${sha256}" = 'af3d15643f8459335b1c98dc97dd47897d2d8e825a990a161b16b43de2281515' ]
            fi
          fi
          case "${filename}" in
            "openwrt-sdk-${OPENWRT_VERSION}-ipq40xx-generic_"*.Linux-x86_64.tar.zst|\
            "openwrt-sdk-${OPENWRT_VERSION}-ipq40xx-generic_"*.Linux-x86_64.tar.xz) ;;
            *) echo "Unexpected SDK: ${filename}" >&2; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/openwrt-sdk-cache/${filename}"
          mkdir -p "$(dirname "${archive}")" logs
          {
            echo "filename=${filename}"
            echo "url=${url}"
            echo "sha256=${sha256}"
            echo "archive=${archive}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "OpenWrt=${OPENWRT_VERSION}"
            echo 'Target=ipq40xx/generic'
            echo 'Package_Architecture=arm_cortex-a7_neon-vfpv4'
            echo "SDK=${url}"
            echo "SDK_SHA256=${sha256}"
          } > logs/sdk-resolution.txt

      - name: Restore SDK cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.sdk.outputs.archive }}
          key: openwrt-sdk-${{ runner.os }}-${{ env.OPENWRT_VERSION }}-${{ steps.sdk.outputs.sha256 }}

      - name: Download and verify SDK
        shell: bash
        env:
          ARCHIVE: ${{ steps.sdk.outputs.archive }}
          EXPECTED_SHA256: ${{ steps.sdk.outputs.sha256 }}
          SDK_URL: ${{ steps.sdk.outputs.url }}
        run: |
          set -euo pipefail
          if [ -f "${ARCHIVE}" ] && ! printf '%s *%s\n' \
            "${EXPECTED_SHA256}" "${ARCHIVE}" | sha256sum --check -; then
            rm -f "${ARCHIVE}"
          fi
          if [ ! -f "${ARCHIVE}" ]; then
            curl --fail --show-error --location --retry 5 --retry-all-errors \
              --output "${ARCHIVE}.part" "${SDK_URL}"
            mv "${ARCHIVE}.part" "${ARCHIVE}"
          fi
          printf '%s *%s\n' "${EXPECTED_SHA256}" "${ARCHIVE}" | \
            tee logs/sdk-SHA256SUMS | sha256sum --check -

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bison build-essential ca-certificates curl file flex g++-multilib \
            gawk gcc-multilib gettext git libelf-dev libncurses-dev libssl-dev \
            patch pkgconf python3 python3-setuptools rsync unzip zlib1g-dev zstd

      - name: Extract SDK
        id: tree
        shell: bash
        env:
          ARCHIVE: ${{ steps.sdk.outputs.archive }}
        run: |
          set -euo pipefail
          sdk_root="${RUNNER_TEMP}/openwrt-sdk"
          mkdir -p "${sdk_root}"
          case "${ARCHIVE}" in
            *.tar.zst) tar --zstd -xf "${ARCHIVE}" -C "${sdk_root}" --strip-components=1 ;;
            *.tar.xz) tar -xJf "${ARCHIVE}" -C "${sdk_root}" --strip-components=1 ;;
          esac
          test -x "${sdk_root}/scripts/feeds"
          test -f "${sdk_root}/rules.mk"
          echo "root=${sdk_root}" >> "${GITHUB_OUTPUT}"

      - name: Prepare pinned feeds and local packages
        shell: bash
        env:
          SDK_ROOT: ${{ steps.tree.outputs.root }}
        run: |
          set -euo pipefail
          cd "${SDK_ROOT}"
          cp feeds.conf.default feeds.conf
          if grep -Ev \
            '^[[:space:]]*(#|$)|^[[:space:]]*src-git[-a-z]*([[:space:]]+--[^[:space:]]+)*[[:space:]]+[^[:space:]]+[[:space:]]+[^[:space:]]+\^[0-9a-f]{40}[[:space:]]*$' \
            feeds.conf; then
            echo 'Every SDK feed must be pinned to a full Git commit' >&2
            exit 1
          fi
          ./scripts/feeds update -a 2>&1 | tee "${GITHUB_WORKSPACE}/logs/feeds-update.log"
          modemmanager_ref='d011c4fb8af70795928937ad5195479cc4ff6de9'
          modemmanager_tree="${RUNNER_TEMP}/openwrt-packages-modemmanager"
          git init -q "${modemmanager_tree}"
          git -C "${modemmanager_tree}" remote add origin \
            https://github.com/openwrt/packages.git
          git -C "${modemmanager_tree}" fetch --depth 1 origin \
            "${modemmanager_ref}"
          git -C "${modemmanager_tree}" checkout --detach FETCH_HEAD
          test "$(git -C "${modemmanager_tree}" rev-parse HEAD)" = \
            "${modemmanager_ref}"
          grep -Fq 'PKG_VERSION:=1.24.0' \
            "${modemmanager_tree}/net/modemmanager/Makefile"
          grep -Fq 'PKG_RELEASE:=10' \
            "${modemmanager_tree}/net/modemmanager/Makefile"
          rm -rf feeds/packages/net/modemmanager
          cp -a "${modemmanager_tree}/net/modemmanager" \
            feeds/packages/net/
          {
            echo 'ModemManager_Package=1.24.0-r10'
            echo "ModemManager_Recipe_Commit=${modemmanager_ref}"
          } > "${GITHUB_WORKSPACE}/logs/modemmanager-recipe-source.txt"
          ./scripts/feeds install modemmanager luci-base \
            luci-proto-modemmanager 2>&1 | \
            tee "${GITHUB_WORKSPACE}/logs/feeds-install.log"
          modemmanager_recipe='feeds/packages/net/modemmanager/Makefile'
          grep -Fq -- '-Dbuiltin_plugins=true' "${modemmanager_recipe}"
          grep -F -- '-Dbuiltin_plugins=true' "${modemmanager_recipe}" \
            > "${GITHUB_WORKSPACE}/logs/modemmanager-plugin-contract.txt"
          rm -rf package/fibocom-mm-bridge package/luci-app-fibocom
          cp -a "${GITHUB_WORKSPACE}/fibocom-mm-bridge" package/
          cp -a "${GITHUB_WORKSPACE}/luci-app-fibocom" package/

      - name: Configure base build
        shell: bash
        env:
          SDK_ROOT: ${{ steps.tree.outputs.root }}
        run: |
          set -euo pipefail
          cd "${SDK_ROOT}"
          cat >> .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_PACKAGE_modemmanager=m
          CONFIG_PACKAGE_fibocom-mm-bridge=m
          CONFIG_PACKAGE_luci-app-fibocom=m
          CONFIG_MODEMMANAGER_WITH_MBIM=y
          CONFIG_MODEMMANAGER_WITH_NETIFD=y
          # CONFIG_MODEMMANAGER_WITH_AT_COMMAND_VIA_DBUS is not set
          # CONFIG_FIBOCOM_MM_BRIDGE_L850_EXPERT is not set
          EOF
          make defconfig 2>&1 | tee "${GITHUB_WORKSPACE}/logs/defconfig-base.log"
          cp .config "${GITHUB_WORKSPACE}/logs/config-base"
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="arm_cortex-a7_neon-vfpv4"$' .config
          ! grep -q '^CONFIG_MODEMMANAGER_WITH_AT_COMMAND_VIA_DBUS=y$' .config
          ! grep -q '^CONFIG_FIBOCOM_MM_BRIDGE_L850_EXPERT=y$' .config

      - name: Build and verify base packages
        shell: bash
        env:
          SDK_ROOT: ${{ steps.tree.outputs.root }}
        run: |
          set -euo pipefail
          cd "${SDK_ROOT}"
          set +e
          make -j"$(nproc)" package/fibocom-mm-bridge/compile \
            package/luci-app-fibocom/compile V=s 2>&1 | \
            tee "${GITHUB_WORKSPACE}/logs/build-base.log"
          build_status="${PIPESTATUS[0]}"
          set -e
          if [ "${build_status}" -ne 0 ]; then
            echo "Base package build failed with status ${build_status}" >&2
            exit "${build_status}"
          fi
          if ! grep -Fq 'libmm-plugin-fibocom.a' \
            "${GITHUB_WORKSPACE}/logs/build-base.log"; then
            echo 'Fibocom ModemManager plugin was not linked in the base build' >&2
            exit 1
          fi
          if ! grep -Fq 'libmm-shared-xmm.a' \
            "${GITHUB_WORKSPACE}/logs/build-base.log"; then
            echo 'XMM shared plugin code was not linked in the base build' >&2
            exit 1
          fi
          mapfile -t binaries < <(find build_dir/target-* \
            -path '*/fibocom-mm-bridge-0.5.0/.pkgdir/fibocom-mm-bridge/usr/sbin/fibocom-mm-bridge' \
            -type f)
          printf 'Base_bridge_binary_count=%s\n' "${#binaries[@]}" | \
            tee "${GITHUB_WORKSPACE}/logs/verify-base.txt"
          if [ "${#binaries[@]}" -ne 1 ]; then
            printf '%s\n' "${binaries[@]}" >&2
            echo 'Expected exactly one packaged base bridge binary' >&2
            exit 1
          fi
          if strings "${binaries[0]}" | grep -Fx 'fibocom.mm.l850' \
            >> "${GITHUB_WORKSPACE}/logs/verify-base.txt"; then
            echo 'Base bridge unexpectedly contains the expert object name' >&2
            exit 1
          fi
          if strings "${binaries[0]}" | grep -Fx 'AT+GTCAINFO?' \
            >> "${GITHUB_WORKSPACE}/logs/verify-base.txt"; then
            echo 'Base bridge unexpectedly contains the expert carrier command' >&2
            exit 1
          fi
          echo 'Expert_Object=absent' >> "${GITHUB_WORKSPACE}/logs/verify-base.txt"
          echo 'Expert_Carrier_Command=absent' \
            >> "${GITHUB_WORKSPACE}/logs/verify-base.txt"

      - name: Collect base packages
        shell: bash
        env:
          SDK_ROOT: ${{ steps.tree.outputs.root }}
        run: |
          set -euo pipefail
          cd "${SDK_ROOT}"
          mkdir -p "${GITHUB_WORKSPACE}/dist/base"
          mapfile -d '' packages < <(find bin/packages -type f \
            \( -name 'fibocom-mm-bridge-*.apk' -o -name 'fibocom-mm-bridge_*.ipk' \
               -o -name 'luci-app-fibocom-[0-9]*.apk' -o -name 'luci-app-fibocom_*_all.ipk' \) \
            -print0)
          [ "${#packages[@]}" -eq 2 ]
          cp "${packages[@]}" "${GITHUB_WORKSPACE}/dist/base/"
          {
            echo "OpenWrt=${OPENWRT_VERSION}"
            echo 'Target=ipq40xx/generic'
            echo 'Package_Architecture=arm_cortex-a7_neon-vfpv4'
            echo 'API_Schema=4'
            echo 'Expert_Object=absent'
            echo 'ModemManager_Recipe=1.24.0-r10'
            echo "Source_Commit=${GITHUB_SHA}"
          } > "${GITHUB_WORKSPACE}/dist/base/BUILD_INFO.txt"
          (
            cd "${GITHUB_WORKSPACE}/dist/base"
            find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) \
              -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            test -s SHA256SUMS
          )

      - name: Configure explicit expert build
        shell: bash
        env:
          SDK_ROOT: ${{ steps.tree.outputs.root }}
        run: |
          set -euo pipefail
          cd "${SDK_ROOT}"
          sed -i '/CONFIG_MODEMMANAGER_WITH_AT_COMMAND_VIA_DBUS/d' .config
          sed -i '/CONFIG_FIBOCOM_MM_BRIDGE_L850_EXPERT/d' .config
          cat >> .config <<'EOF'
          CONFIG_MODEMMANAGER_WITH_AT_COMMAND_VIA_DBUS=y
          CONFIG_FIBOCOM_MM_BRIDGE_L850_EXPERT=y
          EOF
          make defconfig 2>&1 | tee "${GITHUB_WORKSPACE}/logs/defconfig-expert.log"
          grep -q '^CONFIG_MODEMMANAGER_WITH_AT_COMMAND_VIA_DBUS=y$' .config
          grep -q '^CONFIG_FIBOCOM_MM_BRIDGE_L850_EXPERT=y$' .config
          cp .config "${GITHUB_WORKSPACE}/logs/config-expert"

      - name: Build and verify explicit expert package
        shell: bash
        env:
          SDK_ROOT: ${{ steps.tree.outputs.root }}
        run: |
          set -euo pipefail
          cd "${SDK_ROOT}"
          make package/feeds/packages/modemmanager/clean
          make package/fibocom-mm-bridge/clean
          set +e
          make -j"$(nproc)" \
            package/feeds/packages/modemmanager/compile \
            package/fibocom-mm-bridge/compile V=s 2>&1 | \
            tee "${GITHUB_WORKSPACE}/logs/build-expert.log"
          build_status="${PIPESTATUS[0]}"
          set -e
          if [ "${build_status}" -ne 0 ]; then
            echo "Expert package build failed with status ${build_status}" >&2
            exit "${build_status}"
          fi
          if ! grep -Fq -- '-Dat_command_via_dbus=true' \
            "${GITHUB_WORKSPACE}/logs/build-expert.log"; then
            echo 'Expert ModemManager did not enable AT command transport' >&2
            exit 1
          fi
          mapfile -t binaries < <(find build_dir/target-* \
            -path '*/fibocom-mm-bridge-0.5.0/.pkgdir/fibocom-mm-bridge/usr/sbin/fibocom-mm-bridge' \
            -type f)
          printf 'Expert_bridge_binary_count=%s\n' "${#binaries[@]}" | \
            tee "${GITHUB_WORKSPACE}/logs/verify-expert.txt"
          if [ "${#binaries[@]}" -ne 1 ]; then
            printf '%s\n' "${binaries[@]}" >&2
            echo 'Expected exactly one packaged expert bridge binary' >&2
            exit 1
          fi
          if ! strings "${binaries[0]}" | grep -Fx 'fibocom.mm.l850' \
            >> "${GITHUB_WORKSPACE}/logs/verify-expert.txt"; then
            echo 'Expert bridge does not contain the expert object name' >&2
            exit 1
          fi
          if ! strings "${binaries[0]}" | grep -Fx 'get_carrier_info' \
            >> "${GITHUB_WORKSPACE}/logs/verify-expert.txt"; then
            echo 'Expert bridge does not contain the carrier method' >&2
            exit 1
          fi
          if ! strings "${binaries[0]}" | grep -Fx 'AT+GTCAINFO?' \
            >> "${GITHUB_WORKSPACE}/logs/verify-expert.txt"; then
            echo 'Expert bridge does not contain the reviewed carrier command' >&2
            exit 1
          fi
          echo 'Expert_Object=fibocom.mm.l850' \
            >> "${GITHUB_WORKSPACE}/logs/verify-expert.txt"
          echo 'Expert_Carrier_Method=get_carrier_info' \
            >> "${GITHUB_WORKSPACE}/logs/verify-expert.txt"

      - name: Collect expert package
        shell: bash
        env:
          SDK_ROOT: ${{ steps.tree.outputs.root }}
        run: |
          set -euo pipefail
          cd "${SDK_ROOT}"
          mkdir -p "${GITHUB_WORKSPACE}/dist/expert"
          mapfile -d '' bridge < <(find bin/packages -type f \
            \( -name 'fibocom-mm-bridge-*.apk' -o -name 'fibocom-mm-bridge_*.ipk' \) -print0)
          [ "${#bridge[@]}" -eq 1 ]
          cp "${bridge[0]}" "${GITHUB_WORKSPACE}/dist/expert/"
          mapfile -d '' modemmanager < <(find bin/packages -type f \
            \( -name 'modemmanager-[0-9]*.apk' -o -name 'modemmanager_*.ipk' \) -print0)
          [ "${#modemmanager[@]}" -eq 1 ]
          cp "${modemmanager[0]}" "${GITHUB_WORKSPACE}/dist/expert/"
          mapfile -d '' luci < <(find "${GITHUB_WORKSPACE}/dist/base" \
            -maxdepth 1 -type f \
            \( -name 'luci-app-fibocom-*.apk' -o -name 'luci-app-fibocom_*.ipk' \) -print0)
          [ "${#luci[@]}" -eq 1 ]
          cp "${luci[0]}" "${GITHUB_WORKSPACE}/dist/expert/"
          {
            echo "OpenWrt=${OPENWRT_VERSION}"
            echo 'Target=ipq40xx/generic'
            echo 'Package_Architecture=arm_cortex-a7_neon-vfpv4'
            echo 'API_Schema=4'
            echo 'Expert_Object=fibocom.mm.l850'
            echo 'ModemManager_AT_Command_Via_DBus=enabled'
            echo 'ModemManager_Package=1.24.0-r10'
            echo 'ModemManager_Recipe_Commit=d011c4fb8af70795928937ad5195479cc4ff6de9'
            echo 'Firmware_Allowlist=18500.5001.00.05.27.30'
            echo "Source_Commit=${GITHUB_SHA}"
          } > "${GITHUB_WORKSPACE}/dist/expert/BUILD_INFO.txt"
          (
            cd "${GITHUB_WORKSPACE}/dist/expert"
            find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) \
              -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            test -s SHA256SUMS
          )

      - name: Upload base packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fibocom-base-openwrt-${{ env.OPENWRT_VERSION }}-ipq40xx-generic
          path: dist/base/
          if-no-files-found: error
          retention-days: 14

      - name: Upload live-validated expert package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fibocom-l850-expert-openwrt-${{ env.OPENWRT_VERSION }}-ipq40xx-generic
          path: dist/expert/
          if-no-files-found: error
          retention-days: 14

      - name: Upload SDK logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fibocom-build-logs-openwrt-${{ env.OPENWRT_VERSION }}-ipq40xx-generic
          path: logs/
          if-no-files-found: warn
          retention-days: 14
